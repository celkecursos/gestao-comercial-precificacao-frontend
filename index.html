<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Gestão Comercial e Precificação Dinâmica — produtos, cotações e formação de preços."
    />
    <title>Gestão Comercial e Precificação</title>
    <script>
      // Aplica o tema salvo antes da renderização para evitar "piscar" o tema errado.
      // A chave deve ser a mesma de src/contexts/theme-storage.ts.
      (function () {
        try {
          var saved = localStorage.getItem('gcp:theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : prefersDark
                ? 'dark'
                : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
